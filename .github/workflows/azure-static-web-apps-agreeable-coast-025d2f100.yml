name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The two gates below click through the build served by `vite preview`,
      # which is a static file server with no API behind it. They exist to
      # catch UI regressions -- broken rendering, console errors, WCAG
      # failures -- not to test Fabric, so they run against a build that still
      # carries the mock API. Without this, the cutover to real data fails
      # both gates on a 404 for every /api/* call, which is exactly what
      # happened on 29 Sep 2026.
      #
      # A process environment variable takes precedence over apps/web/.env in
      # Vite (verified with loadEnv), so this build is mocked whatever the
      # committed flag says.
      - name: Build with the mock API, for the quality gates
        run: VITE_USE_MOCKS=true npm run build -w @pfc/web

      # Clicks through the minified build in Chrome; blocks the deploy on any browser error.
      - name: Production smoke test
        run: npm run smoke

      # Every page at phone, tablet and desktop widths, and axe WCAG 2.1 AA in all seven themes.
      - name: Layout and accessibility audit
        run: npm run audit

      # The artifact that actually ships, built from apps/web/.env and so
      # pointing at the real API. Last, so it is what lands in apps/web/dist.
      - name: Build for deployment
        run: npm run build

      - name: Get Id Token
        id: idtoken
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: return await core.getIDToken()

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_COAST_025D2F100 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: close
